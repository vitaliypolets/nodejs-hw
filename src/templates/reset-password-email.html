<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Скидання паролю</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    "
  >
    <div
      style="
        max-width: 600px;
        margin: 0 auto;
        padding: 32px;
        background-color: #ffffff;
        border-radius: 12px;
      "
    >
      <h1 style="margin-top: 0">Скидання паролю</h1>

      <p>Вітаємо, {{name}}!</p>

      <p>Ми отримали запит на зміну паролю вашого облікового запису.</p>

      <p>Натисніть кнопку нижче, щоб встановити новий пароль:</p>

      <p style="margin: 32px 0">
        <a
          href="{{link}}"
          style="
            display: inline-block;
            padding: 12px 24px;
            color: #ffffff;
            background-color: #2563eb;
            border-radius: 6px;
            text-decoration: none;
          "
        >
          Скинути пароль
        </a>
      </p>

      <p>Посилання дійсне протягом 15 хвилин.</p>

      <p>
        Якщо ви не надсилали запит на зміну паролю, просто проігноруйте цей
        лист.
      </p>
    </div>
  </body>
</html>
